
name: Diagnostico agencias proxy SGC Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico-proxy:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar proxy y diagnosticar agencias
        env:
          SGC_PROXY_TOKEN: ${{ secrets.SGC_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from collections import Counter

          url = "https://monitor-sismico-sgc-1.onrender.com/api/sgc/eventos"
          token = os.environ.get("SGC_PROXY_TOKEN")

          if not token:
              print("ERROR: No se encontro SGC_PROXY_TOKEN")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Consultando proxy Render...")

          try:
              respuesta = requests.get(
                  url,
                  headers=headers,
                  timeout=120
              )

              print("HTTP:", respuesta.status_code)
              respuesta.raise_for_status()

              resultado = respuesta.json()

              if resultado.get("estado") != "exito":
                  raise ValueError("Estado inesperado del proxy")

              datos = resultado.get("datos", {})
              eventos = datos.get("features", [])
              metadata = datos.get("metadata", {})

              if datos.get("type") != "FeatureCollection":
                  raise ValueError("Respuesta no es FeatureCollection")

              if not isinstance(eventos, list) or not eventos:
                  raise ValueError("Lista de eventos vacia o invalida")

              total = metadata.get("count")

              if total is not None and total != len(eventos):
                  raise ValueError("Conteo metadata no coincide")

              agencias = Counter()
              sin_agencia = 0
              evento_usgs = None

              for evento in eventos:
                  propiedades = evento.get("properties") or {}
                  agencia = propiedades.get("agency")

                  if agencia is None or str(agencia).strip() == "":
                      sin_agencia += 1
                      agencias["SIN_AGENCIA"] += 1
                  else:
                      agencia = str(agencia).strip().upper()
                      agencias[agencia] += 1

                  if evento.get("id") == "USGS2026mwohbp":
                      evento_usgs = {
                          "id": evento.get("id"),
                          "agency": agencia if agencia else "SIN_AGENCIA",
                          "mag": propiedades.get("mag"),
                          "time": propiedades.get("utcTime")
                      }

              print("\n========== DIAGNOSTICO DE AGENCIAS ==========")
              print("Total recibido:", len(eventos))
              print("Total metadata:", total)
              print("\nDistribucion por agencia:")

              for agencia, cantidad in sorted(agencias.items()):
                  print(f"{agencia}: {cantidad}")

              print("\nEventos sin agencia:", sin_agencia)
              print("\nEvento USGS2026mwohbp:")

              if evento_usgs:
                  print(evento_usgs)
              else:
                  print("NO APARECE EN LA RESPUESTA ACTUAL")

              print("\nTiempo:", resultado.get("tiempo_segundos"))
              print("Periodo:", resultado.get("periodo_consultado"))
              print("ESTADO: DIAGNOSTICO COMPLETADO")

          except Exception as error:
              print("ERROR:", str(error))
              sys.exit(1)
          PY
