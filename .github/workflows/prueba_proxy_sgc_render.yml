
name: Prueba autenticacion proxy SGC Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-proxy:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar proxy SGC en Render
        env:
          SGC_PROXY_TOKEN: ${{ secrets.SGC_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          url = "https://monitor-sismico-sgc-1.onrender.com/api/sgc/eventos"

          token = os.environ.get("SGC_PROXY_TOKEN")

          if not token:
              print("ERROR: No se encontro el secreto SGC_PROXY_TOKEN")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Consultando proxy de Render...")

          try:
              respuesta = requests.get(
                  url,
                  headers=headers,
                  timeout=120
              )

              print("HTTP:", respuesta.status_code)

              if respuesta.status_code != 200:
                  print("ERROR: El proxy no autorizo o no completo la consulta.")
                  print("Respuesta:", respuesta.text[:1000])
                  sys.exit(1)

              resultado = respuesta.json()

              if resultado.get("estado") != "exito":
                  print("ERROR: Estado inesperado del proxy.")
                  sys.exit(1)

              datos = resultado.get("datos", {})
              eventos = datos.get("features", [])
              metadata = datos.get("metadata", {})

              if datos.get("type") != "FeatureCollection":
                  print("ERROR: Respuesta no es FeatureCollection.")
                  sys.exit(1)

              if not isinstance(eventos, list) or not eventos:
                  print("ERROR: No se recibieron eventos.")
                  sys.exit(1)

              total = metadata.get("count")

              if total is not None and total != len(eventos):
                  print("ERROR: El conteo de metadata no coincide.")
                  sys.exit(1)

              print("ESTADO: EXITO")
              print("Eventos recibidos:", len(eventos))
              print("Total metadata:", total)
              print("Tiempo de consulta:", resultado.get("tiempo_segundos"), "segundos")
              print("Periodo:", resultado.get("periodo_consultado"))
              print("Autenticacion y respuesta JSON verificadas.")

          except Exception as error:
              print("ERROR:", str(error))
              sys.exit(1)
          PY
