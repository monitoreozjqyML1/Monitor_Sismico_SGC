name: Monitor Sísmico SGC

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "NORMAL"
        type: choice
        options:
          - NORMAL
          - PRUEBA_TELEGRAM

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar prueba Telegram
        if: ${{ github.event.inputs.modo == 'PRUEBA_TELEGRAM' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import monitor_sgc_cloud as m

          resultado = {
              "magnitud": 4.9,
              "profundidad": 147,
              "distancia_km": 180.5,
              "lugar": "Los Santos — Santander",
              "hora_local": "2026-08-26 11:45:14",
              "candidato_acelerografico": True,

              "acelerografia_bogota": {
                  "estado": "OK",
                  "estaciones": [
                      {
                          "pgaE": 0.241789,
                          "pgaN": 0.305373,
                          "pgaZ": 0.129058
                      }
                  ],
                  "pga_maximo_cm_s2": 0.305373,
                  "componente_critica": "NS"
              },

              "alerta_pga": {
                  "estado": "VERDE",
                  "porcentaje_ns": 5.4531,
                  "porcentaje_ew": 6.5348,
                  "porcentaje_maximo": 6.5348,
                  "componente_critica": "NS"
              }
          }

          resultados = []

          resultados.append(
              (
                  "ALERTA SÍSMICA",
                  m.enviar_alerta_telegram(resultado)
              )
          )

          resultados.append(
              (
                  "PGA ACTUALIZADA",
                  m.enviar_reporte_pga_actualizado_telegram(
                      resultado,
                      "PRUEBA_PGA_20260917"
                  )
              )
          )

          resultados.append(
              (
                  "EVENTO SÍSMICO ACTUALIZADO",
                  m.enviar_evento_actualizado_telegram(
                      resultado,
                      "PRUEBA_EVENTO_20260917",
                      4.7
                  )
              )
          )

          for nombre, enviado in resultados:
              if not enviado:
                  raise SystemExit(
                      f"ERROR: Telegram no confirmó: {nombre}"
                  )

          print("PRUEBA TELEGRAM 3 MENSAJES: ENVÍO CONFIRMADO")
          PY

      - name: Diagnóstico acceso SGC
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        run: |
          python - <<'PY'
          import requests

          url = "https://archive.sgc.gov.co/feed/v1.0.1/summary/five_days_all.json"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
              "Referer": "https://www.sgc.gov.co/"
          }

          respuesta = requests.get(
              url,
              headers=headers,
              timeout=30
          )

          print("STATUS:", respuesta.status_code)
          print("SERVER:", respuesta.headers.get("Server"))
          print("CONTENT-TYPE:", respuesta.headers.get("Content-Type"))
          print("CONTENT:", respuesta.text[:500])
          PY

      - name: Diagnóstico DNS y red SGC
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        run: |
          python - <<'PY'
          import socket
          import requests

          host = "archive.sgc.gov.co"
          url = "https://archive.sgc.gov.co/feed/v1.0.1/summary/five_days_all.json"

          print("=== DNS ===")
          print(socket.gethostbyname_ex(host))

          print("=== IP PUBLICA DEL RUNNER ===")
          try:
              ip_publica = requests.get(
                  "https://api.ipify.org",
                  timeout=15
              ).text
              print(ip_publica)
          except Exception as e:
              print("ERROR IP PUBLICA:", e)

          print("=== PRUEBA USER-AGENT NORMAL ===")
          try:
              r = requests.get(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  },
                  timeout=30
              )
              print("STATUS:", r.status_code)
              print("SERVER:", r.headers.get("Server"))
              print("CONTENT-TYPE:", r.headers.get("Content-Type"))
              print("CONTENT:", r.text[:200])
          except Exception as e:
              print("ERROR:", repr(e))
          PY

      - name: Ejecutar monitor sísmico
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_sgc_cloud.py

      - name: Guardar cambios
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eventos_detectados.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar monitor sísmico"
            git push
          fi