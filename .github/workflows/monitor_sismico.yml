name: Monitor Sísmico SGC

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "NORMAL"
        type: choice
        options:
          - NORMAL
          - PRUEBA_TELEGRAM

permissions:
  contents: write

concurrency:
  group: monitor-sismico
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar prueba Telegram
        if: ${{ github.event.inputs.modo == 'PRUEBA_TELEGRAM' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import monitor_sgc_cloud as m

          base = {
              "magnitud": 4.6,
              "profundidad": 41.55,
              "distancia_km": 57.7,
              "lugar": "Istmina - Chocó, Colombia",
              "hora_local": "2026-09-18 07:00:00",
              "candidato_acelerografico": True,

              "acelerografia_bogota": {
                  "estado": "OK",
                  "estaciones": [
                      {
                          "pgaE": 0.089693,
                          "pgaN": 0.049963,
                          "pgaZ": 0.035380
                      }
                  ],
                  "pga_maximo_cm_s2": 0.089693,
                  "componente_critica": "EW"
              },

              "alerta_pga": {
                  "estado": "VERDE",
                  "porcentaje_ns": 0.89,
                  "porcentaje_ew": 1.60,
                  "porcentaje_maximo": 1.60,
                  "componente_critica": "EW"
              }
          }

          print("=== PRUEBA 1: ALERTA INICIAL + PGA ===")
          if not m.enviar_alerta_telegram(base):
              raise SystemExit("ERROR: fallo en alerta inicial")

          print("=== PRUEBA 2: ACTUALIZACION SGC + PGA ===")
          if not m.enviar_reporte_pga_actualizado_telegram(
              base,
              "PRUEBA_UNIFICADA_20260918",
              3.7,
              incluir_actualizacion=True
          ):
              raise SystemExit("ERROR: fallo en actualizacion + PGA")

          print("=== PRUEBA 3: ACTUALIZACION SGC + PGA PENDIENTE ===")
          pendiente = dict(base)
          pendiente["acelerografia_bogota"] = {"estado": "PENDIENTE"}
          pendiente["alerta_pga"] = None

          if not m.enviar_evento_actualizado_telegram(
              pendiente,
              "PRUEBA_PGA_PENDIENTE_20260918",
              3.7
          ):
              raise SystemExit("ERROR: fallo en actualizacion con PGA pendiente")

          print("=== PRUEBA 4: PGA POSTERIOR + CIERRE ===")
          if not m.enviar_reporte_pga_actualizado_telegram(
              base,
              "PRUEBA_PGA_PENDIENTE_20260918",
              3.7,
              incluir_actualizacion=True
          ):
              raise SystemExit("ERROR: fallo en PGA posterior")

          print("PRUEBA TELEGRAM ACTUALIZADA: 4 ESCENARIOS ENVIADOS")
          PY

      - name: Diagnostico consulta principal SGC
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = (
              "https://bdrsnc.sgc.gov.co/paginas1/catalogo/"
              "Consulta_Experta_Seiscomp/consulta_sismo.php"
          )

          hoy = datetime.now(
              ZoneInfo("America/Bogota")
          ).strftime("%d/%m/%Y")

          datos = {
              "inicial": hoy,
              "final": hoy,
              "ubi": "cuadrante",
              "longitudStart": "-90",
              "longitudEnd": "-66",
              "latitudStart": "-07",
              "latitudEnd": "15",
              "magnitudStart": "0",
              "magnitudEnd": "9",
              "depthStart": "0",
              "depthEnd": "700",
              "rmsStart": "0",
              "rmsEnd": "10",
              "gapStart": "0",
              "gapEnd": "360",
              "eprofmin": "0",
              "eprofmax": "999",
              "elongmin": "0",
              "elongmax": "999",
              "elatmin": "0",
              "elatmax": "999",
              "Submit": "Consultar"
          }

          print("=== DIAGNOSTICO ENDPOINT PRINCIPAL SGC ===")
          print("URL:", url)
          print("METODO: POST")
          print("FECHA COLOMBIA:", hoy)

          try:
              r = requests.post(url, data=datos, timeout=30)
              contenido = r.text or ""

              print("HTTP:", r.status_code)
              print("SERVER:", r.headers.get("Server"))
              print("CONTENT-TYPE:", r.headers.get("Content-Type"))
              print("BYTES:", len(r.content))
              print(
                  "TABLA HTML:",
                  bool(
                      re.search(r'<table\b', contenido, re.I)
                      and re.search(r'</table\s*>', contenido, re.I)
                  )
              )
              print("MARCADOR SGC2026:", "SGC2026" in contenido)
              print("INICIO RESPUESTA:", contenido[:300])

          except Exception as e:
              print("DIAGNOSTICO: ERROR DE CONEXION")
              print(type(e).__name__, str(e))

          print("Diagnostico terminado; no modifica archivos.")
          PY

      - name: Ejecutar monitor sísmico
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_sgc_cloud.py

      - name: Actualizar hist?rico permanente PGA
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        run: python actualizar_historial_pga.py

      - name: Guardar cambios
        if: ${{ github.event.inputs.modo != 'PRUEBA_TELEGRAM' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- eventos_detectados.json historial_candidatos_pga.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar monitor sísmico"
            if git push; then
              echo "Push exitoso al primer intento."
            else
              echo "Push rechazado. Sincronizando con origin/main y reintentando..."
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi
