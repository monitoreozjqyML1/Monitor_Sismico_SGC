name: Prueba Telegram Monitor

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt

      - name: Enviar prueba Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import monitor_sgc_cloud as m; r=m.enviar_alerta_telegram({'magnitud':4.5,'profundidad':40.0,'distancia_bogota':123.4,'lugar':'PRUEBA CONTROLADA - Colombia','fecha_local':'2026-09-08 10:30:00','tipo_alerta':'SISMO M >= 4.0','alertas':['SISMO M >= 4.0']}); print('Resultado Telegram:', r)"
