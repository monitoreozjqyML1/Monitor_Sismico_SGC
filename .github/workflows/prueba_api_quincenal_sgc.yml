
name: Prueba independiente API quincenal SGC

on:
  push:
    branches:
      - prueba-api-quincenal-aislada

permissions:
  contents: read

jobs:
  consultar-api:
    name: Comparar acceso HTTP a API SGC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comparar User-Agent y diagnosticar respuestas
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import urllib.error
          import json

          inicio = "2026-10-17T00:00:00"
          fin = "2026-10-30T23:59:59"

          base = "https://api.sgc.gov.co/biweekly/biweekly_earthquakes"

          parametros = urllib.parse.urlencode({
              "startdate": inicio,
              "enddate": fin
          })

          url = f"{base}?{parametros}"

          agentes = [
              (
                  "USER_AGENT_DIAGNOSTICO",
                  "Monitor-Sismico-SGC-diagnostic/1.0"
              ),
              (
                  "USER_AGENT_CHROME",
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/130.0.0.0 Safari/537.36"
              )
          ]

          print("=" * 70)
          print("PRUEBA COMPARATIVA DE ACCESO API QUINCENAL SGC")
          print("=" * 70)
          print("INICIO:", inicio)
          print("FIN:", fin)
          print("URL:", url)

          for nombre, agente in agentes:

              print("\n" + "=" * 70)
              print("PRUEBA:", nombre)
              print("=" * 70)

              solicitud = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": agente,
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      solicitud,
                      timeout=60
                  ) as respuesta:

                      codigo = respuesta.status
                      cuerpo = respuesta.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print("HTTP:", codigo)
                      print("CABECERAS:")
                      print(dict(respuesta.headers))

                      try:
                          datos = json.loads(cuerpo)
                          print("TIPO:", datos.get("type"))
                          eventos = datos.get("features", [])
                          print("TOTAL EVENTOS:", len(eventos))
                      except json.JSONDecodeError:
                          print("RESPUESTA NO JSON:")
                          print(cuerpo[:3000])

              except urllib.error.HTTPError as error:

                  print("HTTP:", error.code)
                  print("MOTIVO:", error.reason)

                  print("CABECERAS:")
                  print(dict(error.headers))

                  cuerpo_error = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("CUERPO:")
                  print(cuerpo_error[:5000])

              except Exception as error:

                  print("ERROR:", type(error).__name__)
                  print("DETALLE:", str(error))

          print("\n" + "=" * 70)
          print("FIN DE LA PRUEBA COMPARATIVA")
          print("=" * 70)

          PY
