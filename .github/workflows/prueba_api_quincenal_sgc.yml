name: Prueba independiente API quincenal SGC

on:
  push:
    branches:
      - prueba-api-quincenal-aislada
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar-api:
    name: Validar acceso remoto al SGC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar API y validar respuesta
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import json
          import sys

          inicio = "2026-10-17T00:00:00"
          fin = "2026-10-30T23:59:59"
          base = "https://api.sgc.gov.co/biweekly/biweekly_earthquakes"

          parametros = urllib.parse.urlencode({
              "startdate": inicio,
              "enddate": fin
          })
          url = f"{base}?{parametros}"

          agentes = [
              ("DIAGNOSTICO", "Monitor-Sismico-SGC/1.0"),
              ("NAVEGADOR", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36")
          ]

          exitos = []

          for nombre, agente in agentes:
              print(f"\n========== {nombre} ==========")
              solicitud = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": agente,
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(solicitud, timeout=60) as respuesta:
                      datos = json.loads(respuesta.read().decode("utf-8"))
                      features = datos.get("features")
                      metadata = datos.get("metadata", {})

                      if (
                          respuesta.status != 200
                          or datos.get("type") != "FeatureCollection"
                          or not isinstance(features, list)
                          or not features
                          or metadata.get("count") != len(features)
                      ):
                          raise RuntimeError("Respuesta HTTP o GeoJSON incompleto.")

                      print("HTTP:", respuesta.status)
                      print("EVENTOS:", len(features))
                      print("METADATA:", metadata)
                      exitos.append(nombre)

              except Exception as error:
                  print("FALLO:", type(error).__name__, str(error))

          print("\n========== RESULTADO REMOTO ==========")

          if exitos:
              print("ACCESO SGC CONFIRMADO:", ", ".join(exitos))
          else:
              print("ACCESO SGC NO DISPONIBLE")
              sys.exit(1)
          PY
