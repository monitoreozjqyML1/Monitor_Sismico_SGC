name: Prueba de acceso al catalogo web oficial SGC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar los cinco listados oficiales
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          base = "https://archive.sgc.gov.co/feed/v1.0.1"

          rutas = [
              "summary/five_days_all.json",
              "summary/five_days_2.json",
              "summary/thirty_days_important.json",
              "summary/sixty_days_4.json",
              "summary/international.json",
          ]

          fallos = 0
          ids_por_lista = {}
          todos_los_ids = {}

          print("PRUEBA DE ACCESO AL CATALOGO WEB SGC")
          print("Fuente:", base)

          for ruta in rutas:
              url = f"{base}/{ruta}"
              print("\n===================================")
              print("LISTADO:", ruta)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "MonitorSGC-Diagnostic/1.0",
                          "Accept": "application/json"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                      raw = response.read()

                  print("HTTP:", status)
                  print("Bytes:", len(raw))

                  if status != 200:
                      raise ValueError(f"HTTP inesperado: {status}")

                  data = json.loads(raw.decode("utf-8-sig"))
                  features = data.get("features")

                  if data.get("type") != "FeatureCollection":
                      raise ValueError("No es una FeatureCollection")

                  if not isinstance(features, list) or not features:
                      raise ValueError("Lista de eventos vacia o invalida")

                  validos = 0
                  invalidos = 0
                  agencias = {}
                  fechas = []
                  ids = set()

                  for evento in features:
                      props = evento.get("properties") or {}
                      geometry = evento.get("geometry") or {}
                      coords = geometry.get("coordinates")
                      event_id = evento.get("id")
                      agency = props.get("agency", "SIN_AGENCIA")

                      agencias[agency] = agencias.get(agency, 0) + 1

                      try:
                          if not event_id:
                              raise ValueError("ID ausente")

                          if agency != "SGC":
                              raise ValueError("Agencia distinta de SGC")

                          if not isinstance(coords, list) or len(coords) < 3:
                              raise ValueError("Coordenadas invalidas")

                          lat, lon, depth = map(float, coords[:3])
                          mag = float(props["mag"])

                          if not (-90 <= lat <= 90):
                              raise ValueError("Latitud fuera de rango")

                          if not (-180 <= lon <= 180):
                              raise ValueError("Longitud fuera de rango")

                          if not (-10 <= mag <= 10):
                              raise ValueError("Magnitud fuera de rango")

                          if not props.get("utcTime"):
                              raise ValueError("utcTime ausente")

                          datetime.strptime(
                              props["utcTime"], "%Y-%m-%d %H:%M"
                          )

                          validos += 1
                          ids.add(event_id)
                          fechas.append(props["utcTime"])

                          todos_los_ids.setdefault(event_id, []).append(ruta)

                      except (ValueError, TypeError, KeyError):
                          invalidos += 1

                  duplicados = len(ids) - len(set(ids))

                  print("Eventos recibidos:", len(features))
                  print("Eventos validos SGC:", validos)
                  print("Registros invalidos:", invalidos)
                  print("Agencias:", agencias)
                  print("IDs unicos:", len(ids))
                  print("Fecha mas reciente:", max(fechas) if fechas else "NO DISPONIBLE")

                  if validos == 0 or invalidos > 0:
                      fallos += 1
                      print("RESULTADO: REVISAR")
                  else:
                      print("RESULTADO: CORRECTO")

                  ids_por_lista[ruta] = ids

              except Exception as exc:
                  fallos += 1
                  print("RESULTADO: ERROR")
                  print("Detalle:", repr(exc))

          print("\n===================================")
          print("RESUMEN DE DUPLICADOS ENTRE LISTADOS")

          repetidos = {
              event_id: listas
              for event_id, listas in todos_los_ids.items()
              if len(listas) > 1
          }

          print("IDs repetidos entre listados:", len(repetidos))
          print("Esto es esperado cuando los listados se superponen.")

          print("\nFALLOS:", fallos)

          if fallos:
              raise SystemExit(1)

          print("RESULTADO FINAL: CINCO LISTADOS VALIDOS")
          PY
